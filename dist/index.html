    <title>Yechim AI</title>
    <script type="module" crossorigin src="/assets/index-DcG7ZSkm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DdL_iffI.css">

  <body>
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('yechim_ai_settings') || '{}');
        const theme = stored.theme === 'dark' || stored.theme === 'light' || stored.theme === 'system' ? stored.theme : 'light';
        document.documentElement.dataset.theme = theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : theme === 'system' ? 'light' : theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <div id="root"></div>
  </body>
</html>
